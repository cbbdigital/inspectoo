[build]
  command = "npm run build"
  publish = "dist"

# Landing public la "/" (dist/index.html) — servit implicit.
# Aplicația la "/dashboard" (dist/dashboard.html).
[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/dashboard/*"
  to = "/dashboard.html"
  status = 200

# Variabile necesare (Netlify → Site settings → Environment variables):
#   VITE_SUPABASE_URL        = https://<proiectul-tau>.supabase.co
#   VITE_SUPABASE_ANON_KEY   = <cheia anon / public>
