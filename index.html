<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inspecto</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
/* Layout: single-column mobile app shell, centered on desktop; fixed bottom dock with raised FAB, sticky navy header */
:root{
  --bg:#e9edf4; --app:#f7f9fc; --surface:#ffffff; --surface-2:#f1f5fb;
  --fg:#101b2e; --muted:#5b6a83; --line:#e4e9f2;
  --accent:#1452e6; --accent-ink:#ffffff; --accent-soft:#e7eeff;
  --ok:#15934e; --ok-soft:#e2f4ea;
  --warn:#c9780a; --warn-soft:#fcefdb;
  --bad:#d8392b; --bad-soft:#fde6e3;
  --nav:#0e1b33; --nav-fg:#eaf0fb; --nav-muted:#8ea0c0;
  --hd:#ffffff; --hd-fg:#0e1b33; --hd-muted:#64748b; --hd-btn:#eef1f7;
  --shadow:0 8px 28px -12px rgba(16,27,46,.28);
  --sheet:#ffffff; --ovl:rgba(16,27,46,.5);
  --r:18px;
  --font-d:"Bricolage Grotesque",system-ui,sans-serif;
  --font-b:"Plus Jakarta Sans",system-ui,sans-serif;
  --font-m:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#060a12; --app:#0b1220; --surface:#121b2c; --surface-2:#0e1626;
  --fg:#eaf0fa; --muted:#93a2bc; --line:#1f2a3e;
  --accent:#5c8bff; --accent-ink:#06122c; --accent-soft:#16233d;
  --ok:#36c276; --ok-soft:#102a1e; --warn:#e5a53c; --warn-soft:#2c2112; --bad:#f06b5f; --bad-soft:#2e1613;
  --nav:#0a1324; --nav-fg:#eaf0fb; --nav-muted:#7488a8;
  --hd:#0a1324; --hd-fg:#eaf0fb; --hd-muted:#7488a8; --hd-btn:rgba(255,255,255,.08);
  --shadow:0 10px 30px -14px rgba(0,0,0,.6);
  --sheet:#1a2742; --ovl:rgba(0,0,0,.68);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#060a12; --app:#0b1220; --surface:#121b2c; --surface-2:#0e1626;
  --fg:#eaf0fa; --muted:#93a2bc; --line:#1f2a3e;
  --accent:#5c8bff; --accent-ink:#06122c; --accent-soft:#16233d;
  --ok:#36c276; --ok-soft:#102a1e; --warn:#e5a53c; --warn-soft:#2c2112; --bad:#f06b5f; --bad-soft:#2e1613;
  --nav:#0a1324; --nav-fg:#eaf0fb; --nav-muted:#7488a8;
  --hd:#0a1324; --hd-fg:#eaf0fb; --hd-muted:#7488a8; --hd-btn:rgba(255,255,255,.08);
  --shadow:0 10px 30px -14px rgba(0,0,0,.6);
  --sheet:#1a2742; --ovl:rgba(0,0,0,.68);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);-webkit-font-smoothing:antialiased;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1,h2,h3{font-family:var(--font-d);margin:0;letter-spacing:-.01em;text-wrap:balance}

/* App frame */
.app{max-width:440px;margin:0 auto;min-height:100%;background:var(--app);position:relative;
  box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column}
@media(min-width:460px){.app{min-height:calc(100% - 0px);border-radius:0}}

/* Header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:30}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hd);color:var(--hd-fg);
  padding:14px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));
  border-radius:0 0 22px 22px;border-bottom:1px solid var(--line)}
.hd-row{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-d);font-weight:800;font-size:19px}
.brand .mk{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#fff}
.hd .sub{color:var(--hd-muted);font-size:12.5px;margin-top:2px}
.icbtn{width:40px;height:40px;border-radius:12px;background:var(--hd-btn);display:grid;place-items:center;color:var(--hd-fg);position:relative;flex:0 0 auto}
.icbtn:active{transform:scale(.94)}
.dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--hd-btn)}
.spacer{flex:1}

/* Scroll area */
.scroll{flex:1;overflow:visible;padding:16px max(16px,env(safe-area-inset-right,0px)) 112px max(16px,env(safe-area-inset-left,0px))}
.screen{display:flex;flex-direction:column;gap:16px;animation:rise .28s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.screen{animation:none}}

.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.scr-title{font-size:25px;font-weight:800;margin-top:2px}

/* Summary tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 12px 13px}
.tile .n{font-family:var(--font-d);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;line-height:1}
.tile .l{font-size:11.5px;color:var(--muted);margin-top:6px;font-weight:600}
.tile.hl{background:var(--accent);border-color:var(--accent)}
.tile.hl .n,.tile.hl .l{color:var(--accent-ink)}

/* Compact day summary */
.azihead{display:flex;flex-direction:column;gap:11px}
.statbar{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:9px 4px;box-shadow:var(--shadow)}
.statbar>span{flex:1;display:flex;align-items:baseline;justify-content:center;gap:6px;color:var(--muted);font-size:12.5px;font-weight:600}
.statbar b{font-family:var(--font-d);font-weight:800;font-size:18px;color:var(--fg);font-variant-numeric:tabular-nums;line-height:1}
.statbar i{width:1px;height:22px;background:var(--line);flex:0 0 auto}
.statbar .accent b{color:var(--accent)}
.statbar .ok b{color:var(--ok)}
.statbar-side{display:none}
.bar{height:9px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--accent)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-pad{padding:16px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 0}
.sec-h h2{font-size:16px;font-weight:700}
.link{color:var(--accent);font-weight:700;font-size:13px}

/* Appointment row */
.appt{display:flex;gap:13px;align-items:center;width:100%;text-align:left;padding:13px 14px;border-bottom:1px solid var(--line)}
.appt:last-child{border-bottom:0}
.appt:active{background:var(--surface-2)}
.time{font-family:var(--font-d);font-weight:800;font-size:15px;min-width:46px;font-variant-numeric:tabular-nums}
.appt .who{flex:1;min-width:0}
.appt .who .nm{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt .who .cx{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:7px;margin-top:3px}
.chev{color:var(--muted);flex:0 0 auto}

/* Plate */
.plate{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:6px;overflow:hidden;font-family:var(--font-m);font-weight:700;font-size:11.5px;background:#fff;color:#0b1220;flex:0 0 auto}
.plate .eu{background:var(--accent);color:#fff;padding:2px 4px;font-size:8.5px;align-self:stretch;display:grid;place-items:center}
.plate .pn{padding:2px 7px;letter-spacing:.04em}

/* Status chip */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{color:var(--ok);background:var(--ok-soft)}
.chip.warn{color:var(--warn);background:var(--warn-soft)}
.chip.bad{color:var(--bad);background:var(--bad-soft)}
.chip.info{color:var(--accent);background:var(--accent-soft)}

/* Next-up hero card */
.next{background:var(--accent-soft);color:var(--fg);border:1px solid var(--accent);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden;display:flex;gap:14px;align-items:center}
.next-main{flex:1;min-width:0}
.next-acts{display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
.next-acts .btn{min-height:40px;padding:9px 16px;white-space:nowrap}
.next .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.next .big{font-family:var(--font-d);font-weight:800;font-size:20px;margin-top:8px;display:flex;align-items:center;gap:10px}
.next .meta{color:var(--muted);font-size:13px;margin-top:4px}
.next .acts{display:flex;gap:10px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px;border-radius:13px;padding:12px 16px;min-height:46px}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.btn.soft{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.btn.full{width:100%}
.btn.ok{background:var(--ok);color:#fff}

/* Quick actions grid */
.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
.ocr-prev{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.ocr-prev img{width:100%;display:block;height:96px;object-fit:cover}
.ocr-prev .rm{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(6,10,18,.62);color:#fff;font-size:17px;line-height:1;display:grid;place-items:center}
.ocr-seg{display:flex;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-top:12px}
.ocr-seg button{flex:1;padding:9px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--muted);background:transparent}
.ocr-seg button.on{background:var(--accent);color:#fff}
.ocr-row{display:flex;gap:8px;align-items:center}
.ocr-row input{flex:1;min-width:0;font-family:var(--font-m);font-weight:700;letter-spacing:.03em}
.ocr-copy{flex:0 0 auto;width:46px;height:46px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent)}
.ocr-copy:active{transform:scale(.94);background:var(--accent-soft)}
.qa button{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 6px;font-size:11.5px;font-weight:600;color:var(--fg)}
.qa button:active{background:var(--surface-2)}
.qa .ico{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}

/* Segmented */
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(16,27,46,.12)}

/* Calendar */
.calhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calttl{font-family:var(--font-d);font-weight:800;font-size:16px}
.icbtn2{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:19px;color:var(--fg);border:1px solid var(--line)}
.icbtn2:active{transform:scale(.94)}
.calwd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin-bottom:6px}
.calwd span{text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dcell{position:relative;min-width:0;aspect-ratio:1;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;color:var(--fg);background:transparent;font-variant-numeric:tabular-nums}
.dcell.empty{pointer-events:none}
.dcell:active{background:var(--surface-2)}
.dcell.today{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent)}
.dcell.sel{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.dday-dot{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);min-width:6px;height:6px;border-radius:999px;background:var(--accent);font-size:8px;font-weight:700;line-height:1;color:#fff;padding:0 3px;display:flex;align-items:center;justify-content:center}
.dcell.sel .dday-dot{background:var(--accent-ink);color:var(--accent)}

/* Search */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px}
.search input{border:0;background:none;outline:none;flex:1;font:inherit;color:var(--fg)}
.search input::placeholder{color:var(--muted)}

/* Client row */
.cli{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:13px 14px;border-bottom:1px solid var(--line)}
.cli:last-child{border-bottom:0}
.cli:active{background:var(--surface-2)}
.av{width:42px;height:42px;border-radius:13px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--font-d);font-weight:800;font-size:15px;flex:0 0 auto}
.cli .info{flex:1;min-width:0}
.cli .info .nm{font-weight:700;font-size:14.5px}
.cli .info .cx{color:var(--muted);font-size:12.5px;margin-top:3px;display:flex;gap:8px;align-items:center}

/* Settings list */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:13px;padding:14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li:last-child{border-bottom:0}
.li:active{background:var(--surface-2)}
.li .ico{width:36px;height:36px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;color:var(--accent);flex:0 0 auto}
.li .tx{flex:1;min-width:0}
.li .tx .t{font-weight:600;font-size:14px}
.li .tx .d{color:var(--muted);font-size:12px;margin-top:1px}
/* toggle */
.sw{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw[aria-pressed="true"]{background:var(--accent)}
.sw[aria-pressed="true"]::after{left:21px}

/* Dock */
.dock{position:fixed;left:0;right:0;bottom:0;max-width:440px;margin:0 auto;z-index:25;pointer-events:none;
  padding:0 max(14px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(14px,env(safe-area-inset-right,0px))}
.dock::before{content:"";position:absolute;inset:-28px 0 0 0;background:linear-gradient(to top,var(--app) 62%,transparent);pointer-events:none;z-index:-1}
.dock-in{pointer-events:auto;max-width:412px;margin:0 auto;background:var(--surface);border:1px solid var(--line);
  border-radius:22px;box-shadow:0 10px 30px -8px rgba(16,27,46,.35);display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center;height:64px;padding:0 6px}
.nav{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:700;padding:8px 0;border-radius:14px}
.nav[aria-selected="true"]{color:var(--accent)}
.nav:active{transform:scale(.92)}
.fab{width:60px;height:60px;border-radius:19px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
  justify-self:center;transform:translateY(-16px);box-shadow:0 12px 24px -6px color-mix(in srgb,var(--accent) 55%,transparent)}
.fab:active{transform:translateY(-16px) scale(.95)}

/* Bottom sheet */
.ov{position:fixed;inset:0;z-index:40;background:var(--ovl);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .25s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:440px;background:var(--sheet);border-top:1px solid var(--line);box-shadow:0 -16px 48px rgba(0,0,0,.4);border-radius:24px 24px 0 0;
  padding:10px max(16px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(16px,env(safe-area-inset-right,0px));
  transform:translateY(100%);transition:transform .28s cubic-bezier(.3,.8,.3,1);max-height:88%;overflow:auto}
.ov.on .sheet{transform:none}
.grip{width:40px;height:4px;border-radius:999px;background:var(--line);margin:4px auto 12px}
.sheet h3{font-size:19px;font-weight:800;margin-bottom:4px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px;outline:none}
.field input:focus,.field select:focus{border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)}
.kv .v{font-weight:600;text-align:right}
.mono{font-family:var(--font-m);font-weight:700}

/* Result picker */
.resgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.resgrid button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:17px 6px;border:1.5px solid var(--line);border-radius:15px;background:var(--surface);font-weight:800;font-family:var(--font-d);font-size:17px;color:var(--fg)}
.resgrid button:active{background:var(--ok-soft);border-color:var(--ok)}
.resgrid .cap{font-family:var(--font-b);font-size:11px;font-weight:600;color:var(--muted)}
.optbtn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:15px;border-radius:14px;font-weight:700;font-size:15px;margin-top:10px;border:1.5px solid var(--line);background:var(--surface)}
.optbtn:active{transform:scale(.98)}
.optbtn.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.optbtn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
/* Photo capture */
.shotgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.shot{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:1.5px dashed color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent);font-size:11px;font-weight:700;background:var(--accent-soft)}
.shot.add:active{transform:scale(.97)}
.shot .rm{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(6,10,18,.62);color:#fff;font-size:16px;line-height:1;display:grid;place-items:center}
.ph-group{margin-top:14px}
.ph-cap{display:flex;align-items:center;gap:8px;font-size:12px;margin:0 2px 8px}
.ph-thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph-th{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;cursor:pointer}
.ph-th:active{transform:scale(.97)}
.editov{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column}
.edit-top{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--hd);color:var(--hd-fg)}
.edit-title{flex:1;font-family:var(--font-d);font-weight:800;font-size:16px}
.edit-x{width:38px;height:38px;border-radius:11px;background:var(--hd-btn);display:grid;place-items:center;color:var(--hd-fg)}
.edit-x svg{transform:rotate(180deg)}
.edit-stage{flex:1;display:grid;place-items:center;overflow:hidden;padding:14px;background:var(--surface-2);min-height:0}
.edit-wrap{position:relative;max-width:100%;max-height:100%;line-height:0}
.edit-wrap #edCanvas{display:block;max-width:100%;max-height:100%;border-radius:10px;box-shadow:var(--shadow);touch-action:none;cursor:crosshair}
.edit-ovl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;border-radius:10px}
.edit-body{flex:1;display:flex;flex-direction:column;min-height:0}
.edit-tools{padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--app);display:flex;flex-direction:column;gap:12px}
@media(min-width:860px){
  .edit-body{flex-direction:row}
  .edit-tools{width:320px;flex:0 0 320px;border-top:none;border-left:1px solid var(--line);overflow:auto;justify-content:center}
  .edit-stage{padding:24px}
}
.edit-row{display:flex;align-items:center;gap:12px}
.edit-row input[type=range]{flex:1;accent-color:var(--accent)}
.edit-actions{display:flex;gap:10px}
.edit-actions .btn{flex:1}
.edit-hint{font-size:12px;color:var(--muted);text-align:center;min-height:14px}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);transform:translateX(-50%) translateY(14px);
  background:var(--nav);color:var(--nav-fg);padding:12px 18px;border-radius:14px;font-size:13.5px;font-weight:600;z-index:60;
  opacity:0;pointer-events:none;transition:all .25s;box-shadow:var(--shadow);display:flex;align-items:center;gap:9px;max-width:90%}
.toast.on{opacity:1;transform:translateX(-50%)}
.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
/* Fluid column wrappers (stack on mobile) */
.azi-cols,.agenda-cols{display:flex;flex-direction:column;gap:16px}
.ag-cal,.ag-day,.azi-list,.azi-side{min-width:0}

/* Desktop sidebar */
.side{display:none}
.side{position:fixed;left:0;top:0;bottom:0;width:250px;flex-direction:column;gap:6px;z-index:26;
  padding:20px 16px calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:var(--surface);border-right:1px solid var(--line)}
.side-new{margin-bottom:8px}
.side-nav{display:flex;flex-direction:column;gap:4px}
.side .nav{flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 13px;border-radius:12px;width:100%;font-size:14px;color:var(--muted)}
.side .nav span{font-size:14px}
.side .nav[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.rail{display:none}
.rail-h{font-family:var(--font-d);font-weight:800;font-size:16px;margin:2px 2px 10px}

@media(min-width:820px){
  .app{max-width:none;margin-left:250px;box-shadow:none}
  .hd{border-radius:0 0 20px 20px}
  .hd .brand{display:none}
  .scroll{padding:24px max(32px,env(safe-area-inset-right,0px)) 48px max(32px,env(safe-area-inset-left,0px))}
  #view>.screen{max-width:1180px;margin:0 auto}
  #view>.scr-clients,#view>.scr-set,#view>.scr-admin{max-width:780px}
  .calgrid .dcell{aspect-ratio:auto;height:56px}
  .azi-cols{display:grid;grid-template-columns:1.7fr 1fr;grid-template-areas:"list side";gap:18px;align-items:start}
  .azi-list{grid-area:list}.azi-side{grid-area:side}
  .statbar-top{display:none}
  .azi-side .statbar-side{display:flex;margin-bottom:12px;padding:7px 2px}
  .azi-side .statbar-side b{font-size:15px}
  .azi-side .statbar-side>span{font-size:11px;gap:5px}
  .azi-side .statbar-side i{height:16px}
  .azi-side .qa{grid-template-columns:1fr;gap:8px}
  .azi-side .qa button{flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;font-size:14px;font-weight:700}
  .azi-side .qa .ico{width:36px;height:36px;flex:0 0 auto}
  .agenda-cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
  .dock{display:none}
  .side{display:flex}
  .ov{align-items:center}
  .ov .sheet{max-width:560px;border-radius:22px;max-height:86vh;border:1px solid var(--line);transform:translateY(14px) scale(.98)}
  .ov.on .sheet{transform:none}
  .scr-title{font-size:26px}
}
@media(min-width:1100px){
  body.rail-on .app{margin-right:344px}
  .rail.on{display:flex;position:fixed;right:0;top:0;bottom:0;width:344px;flex-direction:column;gap:0;z-index:26;overflow:auto;
    padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px)) 18px;background:var(--surface);border-left:1px solid var(--line)}
}

.muted{color:var(--muted)}
.center{text-align:center}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:34px 16px;color:var(--muted);text-align:center}

  function fromMtime(file){
    var d=file&&file.lastModified?new Date(file.lastModified):new Date();
    if(isNaN(d.getTime()))d=new Date();
    return {date:pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear(),time:pad(d.getHours())+':'+pad(d.getMinutes())};
  }
  function parseExif(v,start){
    if(start+10>v.byteLength)return null;
    if(String.fromCharCode(v.getUint8(start),v.getUint8(start+1),v.getUint8(start+2),v.getUint8(start+3))!=='Exif')return null;
    var tiff=start+6;if(tiff+8>v.byteLength)return null;
    var le=v.getUint16(tiff)===0x4949;
    var ifd=tiff+v.getUint32(tiff+4,le);
    function scan(s){
      if(s+2>v.byteLength)return null;
      var n=v.getUint16(s,le);
      for(var i=0;i<n;i++){var eo=s+2+i*12;if(eo+12>v.byteLength)break;var tag=v.getUint16(eo,le);
        if(tag===0x9003||tag===0x9004||tag===0x0132){var c=v.getUint32(eo+4,le);var so=c<=4?eo+8:tiff+v.getUint32(eo+8,le);
          if(so<0||so+c>v.byteLength)continue;var str='';for(var j=0;j<c-1;j++)str+=String.fromCharCode(v.getUint8(so+j));
          if(str.length>=19)return str;}}
      return null;
    }
    var ds=scan(ifd);
    if(!ds){var n=v.getUint16(ifd,le);for(var i=0;i<n;i++){var eo=ifd+2+i*12;if(eo+12>v.byteLength)break;if(v.getUint16(eo,le)===0x8769){ds=scan(tiff+v.getUint32(eo+8,le));if(ds)break;}}}
    if(!ds)return null;var p=ds.split(' ');if(p.length<2)return null;
    return {date:p[0].replace(/:/g,'.'),time:p[1].substring(0,5)};
  }
  function exifDate(file){
    return new Promise(function(res){
      var fr=new FileReader();
      fr.onload=function(e){try{var v=new DataView(e.target.result);
        if(v.byteLength<2||v.getUint16(0)!==0xFFD8)return res(fromMtime(file));
        var off=2;while(off+4<v.byteLength){var m=v.getUint16(off);
          if(m===0xFFE1){var d=parseExif(v,off+4);return res(d||fromMtime(file))}

    });

  function stampPhoto(file){
    return new Promise(function(resolve,reject){
      exifDate(file).then(function(dt){
        var r=new FileReader();
        r.onload=function(ev){var img=new Image();
          img.onload=function(){
            var w=img.width,h=img.height,mx=1920;
            if(w>h){if(w>mx){h=h*mx/w;w=mx}}else{if(h>mx){w=w*mx/h;h=mx}}
            var c=document.createElement('canvas');c.width=w;c.height=h;
            var ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);
            if(dt){var fs=Math.max(20,Math.round(Math.min(w,h)*0.045));var pd=Math.round(fs*0.8);var lg=Math.round(fs*0.35);
              ctx.font='bold '+fs+'px Arial, sans-serif';ctx.textAlign='right';ctx.textBaseline='alphabetic';
              var x=w-pd,yD=h-pd,yT=yD-fs-lg;ctx.lineJoin='round';ctx.strokeStyle='#000';ctx.lineWidth=Math.max(3,Math.round(fs*0.15));

          };
          img.onerror=function(){reject()};img.src=ev.target.result;};
        r.onerror=function(){reject()};r.readAsDataURL(file);
      });
    });

  /* ============================================================

      photoToRow:function(g){g=g||{};var row={appointment_id:g.appointmentId||null,inspection_date:g.date||null,license_plate:g.plate||''};var u=g.imgs||[];for(var i=1;i<=10;i++)row['photo_'+i+'_url']=u[i-1]||null;return row},

      photoPath:function(userId,iso,plate,n,ext){var MN=['January','February','March','April','May','June','July','August','September','October','November','December'];var p=(iso||'').split('-');var my=(p[0]&&p[1])?(MN[+p[1]-1]+' '+p[0]):'';var dd=p.length===3?(p[2]+'.'+p[1]+'.'+p[0]):'';return [userId,my,dd,(plate||'NO_PLATE').replace(/\s+/g,'')+'_'+n+'.'+(ext||'jpg')].join('/')},

  function calCard(){
    var y=S.calY,m=S.calM;
    var startWd=(new Date(y,m,1).getDay()+6)%7;

    var counts={};

    for(var i=0;i<startWd;i++)cells+='<div class="dcell empty"></div>';
    for(var dnum=1;dnum<=days;dnum++){
      var iso=isoYMD(y,m,dnum),cls='dcell';
      if(iso===TODAY)cls+=' today';
      if(iso===S.calSel)cls+=' sel';
      var dot=counts[iso]?'<span class="dday-dot">'+(counts[iso]>1?counts[iso]:'')+'</span>':'';
      cells+='<button class="'+cls+'" data-day="'+iso+'"><span>'+dnum+'</span>'+dot+'</button>';

        +'<div class="calhd"><button class="icbtn2" data-cal="-1" aria-label="Luna anterioară"><span style="display:grid;transform:rotate(180deg)">'+svg('chev',16)+'</span></button><div class="calttl">'+cap(MONTHS[m])+' '+y+'</div><button class="icbtn2" data-cal="1" aria-label="Luna următoare">'+svg('chev',16)+'</button></div>'

  function xlsDate(v){
    if(v==null||v==='')return null;
    if(v instanceof Date){return v.getFullYear()+'-'+('0'+(v.getMonth()+1)).slice(-2)+'-'+('0'+v.getDate()).slice(-2)}
    var s=String(v).trim(),m=s.match(/^(\d{1,2})[.\/\-](\d{1,2})[.\/\-](\d{4})$/);
    if(m)return m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);
    m=s.match(/^(\d{4})[.\/\-](\d{1,2})[.\/\-](\d{1,2})$/);
    if(m)return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
    if(!isNaN(Number(s))){var d=new Date((Number(s)-25569)*86400*1000);if(!isNaN(d.getTime()))return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
    return null;
  }

  function xlsImport(file){
    if(typeof XLSX==='undefined'){toast('Biblioteca Excel nu s-a încărcat');return}
    var r=new FileReader();
    r.onload=function(ev){
      try{
        var wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array',cellDates:true});
        var ws=wb.Sheets[wb.SheetNames[0]];
        var rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,dateNF:'dd.mm.yyyy'});
        var added=0,dup=0,skip=0;
        rows.slice(1).forEach(function(row){
          if(!row||!row.some(function(c){return c!=null&&String(c).trim()!==''}))return;
          var pl=String(row[0]||'').toUpperCase().replace(/\s+/g,'').trim();
          var ph=String(row[1]||'').trim();
          var ex=xlsDate(row[2]);
          var nm=String(row[3]||'').trim();
          if(!pl||!ph||!ex){skip++;return}
          if(S.clients.some(function(c){return c.license_plate===pl})){dup++;return}
          S.clients.unshift({id:Date.now()+added,client_name:nm,license_plate:pl,client_phone:ph,itp_expiry_date:ex});added++;
        });
        render();sheetMyClients();
        toast(added+' adăugați'+(dup?' · '+dup+' dubluri':'')+(skip?' · '+skip+' ignorați':''));
      }catch(e){toast('Fișier invalid. Folosește modelul.')}
    };
    r.readAsArrayBuffer(file);
  }

  function civOK(v){return /^[A-Z]-\d{6,7}$/.test((v||'').trim().toUpperCase())}
  function vinOK(v){return /^[A-HJ-NPR-Z0-9]{17}$/i.test((v||'').trim())}
  function normCiv(t){t=(t||'').toUpperCase().replace(/[\s-]/g,'');var m=t.match(/^([A-Z])(\d{6,7})$/);return m?m[1]+'-'+m[2]:''}
  // corecție OCR pentru CIV: prima poziție literă, restul doar cifre (O->0, I->1, S->5 ...)
  function cleanCiv(raw){
    var s=(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(s.length<7)return normCiv(s);
    var first=s.charAt(0);if(!/[A-Z]/.test(first))return normCiv(s);
    var map={O:'0',Q:'0',D:'0',I:'1',L:'1',Z:'2',S:'5',B:'8',G:'6',T:'7',A:'4'};
    var rest=s.slice(1).split('').map(function(c){return /[0-9]/.test(c)?c:(map[c]!==undefined?map[c]:'')}).join('').slice(0,7);
    var civ=first+'-'+rest;
    return /^[A-Z]-\d{6,7}$/.test(civ)?civ:'';
  }
  // corecție OCR pentru VIN: 17 caractere, fără I/O/Q (I->1, O->0, Q->0)
  function cleanVin(raw){
    var s=(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/I/g,'1').replace(/O/g,'0').replace(/Q/g,'0');
    if(/^[A-HJ-NPR-Z0-9]{17}$/.test(s))return s;
    var m=s.match(/[A-HJ-NPR-Z0-9]{17}/);return m?m[0]:'';
  }

        reader.decodeFromImageUrl(dataUrl).then(function(r){res({text:r.getText()})},function(){res(null)});
      }catch(e){res(null)}
    });
  }

  function cleanSerie(raw){return (raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'')}

  async function runField(key,f,dataUrl){
    S.ocr.err='';
    if(key==='ci'){
      var sm0=null;try{sm0=window.claude&&claude.use?await claude.use('sample'):null}catch(_){}
      if(!sm0){S.ocr.ciBusy=false;S.ocr.err='Citirea automată nu e disponibilă aici. Deschide în aplicația Claude sau completează manual.';renderOcr();return}
      try{
        var lim0=await sm0.limits();
        if(!lim0||!lim0.images){S.ocr.ciBusy=false;S.ocr.err='Citirea din imagine nu e disponibilă pentru acest cont.';renderOcr();return}
        var pci='Ești un OCR pentru acte de identitate românești (carte de identitate / buletin), atât model vechi cât și model nou (eID). Din imagine extrage: nume (numele de familie), prenume, și seria+numărul actului (la modelul vechi: 2 litere apoi 6 cifre, ex. XC123456; la modelul nou de carte electronică: numărul documentului). Răspunde DOAR cu JSON valid: {"nume":"...","prenume":"...","serie":"..."}. Pune șir gol dacă un câmp lipsește.';
        var d=await sm0.json(pci,{images:[f],modelTier:'default',cache:false});
        S.ocr.nume=cleanName(d&&d.nume);S.ocr.prenume=cleanName(d&&d.prenume);S.ocr.serie=cleanSerie(d&&d.serie);
        if(!S.ocr.nume&&!S.ocr.prenume&&!S.ocr.serie)S.ocr.err='Nu am găsit datele pe buletin. Încearcă o poză mai clară.';
      }catch(e){S.ocr.err='Nu am putut citi textul. Reîncearcă cu o poză mai clară.'}
      S.ocr.ciBusy=false;renderOcr();return;
    }
    S.ocr[key+'Src']='';
    // barcode doar pentru CIV (exact, offline)
    if(key==='civ'){
      try{var bc=await decodeBarcode(dataUrl);
        if(bc&&bc.text){var cv=normCiv(bc.text);if(cv){S.ocr.civ=cv;S.ocr.civSrc='barcode';S.ocr.civBusy=false;renderOcr();return}}
      }catch(_){}
    }
    var sm=null;try{sm=window.claude&&claude.use?await claude.use('sample'):null}catch(_){}
    if(!sm){S.ocr[key+'Busy']=false;S.ocr.err='Citirea automată nu e disponibilă aici. Deschide în aplicația Claude sau completează manual.';renderOcr();return}
    try{
      var lim=await sm.limits();
      if(!lim||!lim.images){S.ocr[key+'Busy']=false;S.ocr.err='Citirea din imagine nu e disponibilă pentru acest cont.';renderOcr();return}
      var prompt=key==='civ'
        ?'Ești un OCR pentru documente auto românești (talon / CIV). Din imagine extrage seria CIV: o literă, cratimă, 6 sau 7 cifre (ex. A-1234567). Răspunde DOAR cu JSON valid: {"civ":"..."}. Dacă nu apare, pune șir gol.'
        :'Ești un OCR pentru documente auto românești. Din imagine extrage seria VIN (serie șasiu): exact 17 caractere alfanumerice (fără I, O, Q). Răspunde DOAR cu JSON valid: {"vin":"..."}. Dacă nu apare, pune șir gol.';
      var data=await sm.json(prompt,{images:[f],modelTier:'default',cache:false});
      if(key==='civ'){var oc=cleanCiv((data&&data.civ)||'');S.ocr.civ=oc||((data&&data.civ)||'').toString().trim().toUpperCase();if(!S.ocr.civ)S.ocr.err='Nu am găsit seria CIV. Încearcă o poză mai clară.'}
      else{var ov=cleanVin((data&&data.vin)||'');S.ocr.vin=ov||((data&&data.vin)||'').toString().trim().toUpperCase();if(!S.ocr.vin)S.ocr.err='Nu am găsit seria VIN. Încearcă o poză mai clară.'}
    }catch(e){S.ocr.err='Nu am putut citi textul. Reîncearcă cu o poză mai clară.'}
    S.ocr[key+'Busy']=false;renderOcr();
  }

      if(d.clients)S.clients=d.clients;
      if(d.savedPhotos)S.savedPhotos=d.savedPhotos;
      if(d.inspectors)S.inspectors=d.inspectors;
      if(d.station)S.station=Object.assign({name:'',auth:'',address:''},d.station);
      if(d.smsCfg)S.smsCfg=Object.assign({company:'',maps:'',phone:''},d.smsCfg);
      if(d.plan)S.plan=d.plan;
      render();
    },
    setReadonly:function(on){document.body.classList.toggle('readonly',!!on)}
  };
  document.dispatchEvent(new Event('inspecto-ready'));
})();
</script>
